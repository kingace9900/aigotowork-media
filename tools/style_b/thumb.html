<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans CJK TC",sans-serif;background:linear-gradient(150deg,#eef4ff 0%,#fdf2f8 100%);position:relative}
.big{position:absolute;left:56px;top:70px;font-size:132px;font-weight:900;line-height:1.12;color:#1f2937;letter-spacing:-2px}
.big em{font-style:normal;color:#dc2626}
.sub{position:absolute;left:60px;top:400px;background:#6366f1;color:#fff;font-size:46px;font-weight:800;padding:10px 28px;border-radius:18px}
.row{position:absolute;left:60px;top:520px;display:inline-flex;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:32px;font-weight:700}
.row div{padding:18px 22px;background:#fde8e8;color:#991b1b;border-right:2px solid #fff}.row div:last-child{background:#dc2626;color:#fff;border:0}
.char{position:absolute;right:-60px;bottom:-30px;width:640px;height:640px}
.char img{width:100%}
.brand{position:absolute;top:28px;right:36px;font-size:30px;font-weight:900;color:#6366f1}
</style></head><body>
<div class="big">逾期<br><em>自動變紅</em></div>
<div class="sub">Claude 試算表實測</div>
<div class="row"><div>採購比價</div><div>11/12</div><div>進行中</div><div>逾期！</div></div>
<div class="char"><img src="char_cut.png"></div>
<div class="brand">AI代班中</div>
</body></html>
